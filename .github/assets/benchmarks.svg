<svg xmlns="http://www.w3.org/2000/svg" width="900" height="654" viewBox="0 0 900 654" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">seqblaze speed relative to the fastest competitor</title>
<desc id="d">Throughput ratios from one run per host type, 2026-11-12, log scale; rows marked with a dagger were re-measured on new hosts of the same types after a fix to the benchmark harness. Left: seqblaze on a 16-vCPU AMD EPYC 9655 at 1 and 16 threads against the fastest competitor configuration at the same thread count. Right: seqblaze CUDA on an NVIDIA RTX 6000 Ada against the fastest competitor on that host's 10 CPU threads. The same numbers are in the README table.</desc>
